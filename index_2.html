<style>
  :root {
    --club-primary: #1B458F;
    --club-secondary: #ffffff;
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --text: #f2f3f5;
    --muted: #9aa1ac;
    --good: #2e7d5b;
    --bad: #b3475a;
    --radius: 14px;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  [data-theme="light"] {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-2: #eef0f3;
    --text: #1b1d22;
    --muted: #5b6270;
  }
  * { box-sizing: border-box; }

    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
  }

    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }
  header.top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }

    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
  }
  .logo-img {
    width: 42px; height: 42px;
    border-radius: 11px;
    flex-shrink: 0;
    display: block;
  }
  header.top h1 {
    font-size: 1.3rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.top p {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .icon-btn {
    background: var(--panel-2);
    border: 1px solid rgba(128,128,128,0.25);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .card {
    background: var(--panel);
    border: 1px solid rgba(128,128,128,0.15);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 18px;
  }
  .field { margin-bottom: 18px; }
  .field label.field-label {
    display: block;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  select, input[type="number"], input[type="email"], input[type="password"], input[type="text"], textarea {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid rgba(128,128,128,0.25);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pill {
    background: var(--panel-2);
    border: 1px solid rgba(128,128,128,0.25);
    color: var(--text);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 0.83rem;
    cursor: pointer;
  }
  .pill.active {
    background: var(--club-primary);
    border-color: var(--club-primary);
    color: #fff;
  }
  .pill.small { padding: 5px 11px; font-size: 0.78rem; }
  button.primary {
    width: 100%;
    background: var(--club-primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary.compact { width: auto; padding: 10px 18px; font-size: 0.9rem; }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid rgba(128,128,128,0.3);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }
  button.text-link {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.8rem;
    cursor: pointer;
    padding: 4px 0;
    text-decoration: underline;
    font-family: inherit;
  }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
  }
  .checkbox-row input { width: auto; }
  .q-progress {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .q-text {
    font-size: 1.12rem;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    text-align: left;
    background: var(--panel-2);
    border: 1px solid rgba(128,128,128,0.25);
    color: var(--text);
    padding: 13px 16px;
    border-radius: 10px;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
  }
  .opt:hover { border-color: rgba(128,128,128,0.5); }
  .opt.correct { background: var(--good); border-color: var(--good); color: #fff; }
  .opt.incorrect { background: var(--bad); border-color: var(--bad); color: #fff; }
  .opt.disabled { cursor: default; opacity: 0.9; }
  .opt.reveal-correct-not-picked { border-color: var(--good); box-shadow: inset 0 0 0 2px var(--good); }
  .actions-row { display: flex; justify-content: flex-end; margin-top: 18px; gap: 10px; }
  .score-hero { text-align: center; padding: 26px 10px 6px; }
  .score-hero .big { font-size: 2.6rem; font-weight: 700; }
  .footer-note { text-align: center; color: var(--muted); font-size: 0.76rem; margin-top: 26px; line-height: 1.6; }
  .error-box { background: rgba(179,71,90,0.15); border: 1px solid var(--bad); border-radius: 10px; padding: 14px; font-size: 0.9rem; }
  .info-box { background: rgba(46,125,91,0.12); border: 1px solid var(--good); border-radius: 10px; padding: 12px 14px; font-size: 0.85rem; margin-bottom: 14px; }
  .spinner-row { text-align: center; padding: 30px 0; color: var(--muted); }
  .report-zone { margin-top: 14px; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
  }
  .modal {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 24px;
    max-width: 420px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { margin-top: 0; font-size: 1.1rem; }
  .tab-row { display: flex; gap: 6px; margin-bottom: 18px; }
  .tab-btn {
    flex: 1; background: var(--panel-2); border: 1px solid rgba(128,128,128,0.25);
    color: var(--text); padding: 9px; border-radius: 8px; cursor: pointer; font-size: 0.88rem; font-family: inherit;
  }
  .tab-btn.active { background: var(--club-primary); border-color: var(--club-primary); color: #fff; }
  .close-x {
    background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer;
    float: right; line-height: 1; padding: 0;
  }
</style>

function readLS(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function writeLS(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* non-essential */ }
}

function getServedFactIds() { return new Set(readLS(LS_SERVED_KEY, [])); }
function addServedFactIds(ids) {
  const cur = getServedFactIds();
  ids.forEach(id => cur.add(id));
  writeLS(LS_SERVED_KEY, [...cur]);
}

  answerBank: {},  // category_id -> Set of correct_answer strings (for auto-MC distractors)
  activePreset: null,
  filters: {
    clubIds: savedFilters.clubIds || [],
    categoryIds: savedFilters.categoryIds || [],
    decades: savedFilters.decades || [],
    count: savedFilters.count || 10,
    avoidRepeats: savedFilters.avoidRepeats !== undefined ? savedFilters.avoidRepeats : true,
    generateMc: savedFilters.generateMc !== undefined ? savedFilters.generateMc : true,
  },
  quiz: [],
  currentIndex: 0,
  answered: null,
  score: 0,
  currentSessionId: null,
  reportOpenFor: null,
  reportText: '',
  reportSentFor: new Set(),
};

const root = document.getElementById('app');

function applyTheme() {
  const body = document.body;
  let theme = state.settings.bgTheme;
  if (theme === 'club') {
    const selected = state.filters.clubIds.length === 1
      ? state.clubs.find(c => c.id === state.filters.clubIds[0])
      : null;
    if (selected && selected.primary_color) {
      document.documentElement.style.setProperty('--club-primary', selected.primary_color);
      document.documentElement.style.setProperty('--club-secondary', selected.secondary_color || '#ffffff');
    }
    body.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.style.setProperty('--club-primary', '#1B458F');
    document.documentElement.style.setProperty('--club-secondary', '#ffffff');
    body.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
  }
  const fontMap = {
    system: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif',
    poppins: "'Poppins', sans-serif",
    serif: "'Merriweather', Georgia, serif",
  };
  document.documentElement.style.setProperty('--font-body', fontMap[state.settings.font] || fontMap.system);
}

function saveSettings() { writeLS(LS_SETTINGS_KEY, state.settings); applyTheme(); }
function saveFilters() { writeLS(LS_FILTERS_KEY, state.filters); }

function render() {
  applyTheme();
  if (state.view === 'loading') return renderLoading();
  if (state.view === 'error') return renderError();
  if (state.view === 'setup') return renderSetup();
  if (state.view === 'playing') return renderPlaying();
  if (state.view === 'results') return renderResults();
}

function headerHtml() {
  const authArea = state.user
    ? `<span class="muted" style="font-size:0.8rem;">${escapeHtml(state.user.email)}</span>
       <button class="icon-btn" id="settings-btn">Settings</button>`
    : `<button class="icon-btn" id="signin-btn">Sign in</button>`;
  return `
    <div class="brand">
      <img class="logo-img" src="${LOGO_DATA_URI}" alt="Quiz Composer logo" />
      <div style="min-width:0;">
        <h1>Quiz Composer</h1>
        <p>Multi-club football trivia, generated from a sourced fact database</p>
      </div>
    </div>
    <div class="header-actions">${authArea}</div>
  `;
}

function renderLoading() {
  root.innerHTML = `<header class="top">${headerHtml()}</header><div class="card spinner-row">Loading…</div>`;
}

function renderError() {
  root.innerHTML = `
    <header class="top">${headerHtml()}</header>
    <div class="card"><div class="error-box">${escapeHtml(state.errorMessage)}</div></div>
  `;
  wireHeaderEvents();
}

function wireHeaderEvents() {
  const signinBtn = document.getElementById('signin-btn');
  if (signinBtn) signinBtn.addEventListener('click', () => { state.authModalOpen = true; render(); });
  const settingsBtn = document.getElementById('settings-btn');
  if (settingsBtn) settingsBtn.addEventListener('click', () => { state.settingsOpen = true; render(); });
}

function renderSetup() {
  const clubPills = state.clubs.map(c => pillHtml('club', c.id, c.name, state.filters.clubIds.includes(c.id))).join('');
  const categoryPills = state.categories.map(c => pillHtml('category', c.id, c.name, state.filters.categoryIds.includes(c.id))).join('');
  const decadePills = state.decades.map(d => pillHtml('decade', String(d), d + 's', state.filters.decades.includes(d))).join('');

  const presetButtons = Object.entries(PRESETS).map(([key, p]) => `
    <button type="button" class="pill ${state.activePreset === key ? 'active' : ''}" data-preset="${key}">${escapeHtml(p.label)}</button>
  `).join('');

  root.innerHTML = `
    <header class="top">${headerHtml()}</header>

    <div class="card">
      <div class="field">
        <label class="field-label">Audience preset</label>
        <div class="pill-row">${presetButtons}</div>
        <p class="muted" style="margin-top:8px;">Presets set a question count — pick one or configure manually below.</p>
      </div>

      <div class="field">
        <label class="field-label">Club(s) &mdash; leave empty for any</label>
        <div class="pill-row">${clubPills || '<span class="muted">No clubs yet</span>'}</div>
      </div>

      <div class="field">
        <label class="field-label">Category(ies) &mdash; leave empty for any</label>
        <div class="pill-row">${categoryPills || '<span class="muted">No categories yet</span>'}</div>
      </div>

      <div class="field">
        <label class="field-label">Era(s) &mdash; leave empty for any</label>
        <div class="pill-row">${decadePills || '<span class="muted">No eras yet</span>'}</div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label class="field-label">Number of questions</label>
          <input type="number" id="f-count" min="1" max="50" value="${state.filters.count}" />
        </div>
      </div>

      <div class="field checkbox-row">
        <input type="checkbox" id="f-avoid-repeats" ${state.filters.avoidRepeats ? 'checked' : ''} />
        <label for="f-avoid-repeats">Avoid facts I've already been quizzed on</label>
      </div>

      <div class="field checkbox-row">
        <input type="checkbox" id="f-generate-mc" ${state.filters.generateMc ? 'checked' : ''} />
        <label for="f-generate-mc">Show multiple-choice options for every question (auto-generated when not already stored)</label>
      </div>

      <button class="primary" id="generate-btn">Generate Quiz</button>
    </div>

    <p class="footer-note">
      Every question traces back to a sourced, categorized fact. Think a question or answer is wrong?
      You can flag it during play.
    </p>
  `;

  wireHeaderEvents();

  document.querySelectorAll('.pill[data-preset]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activePreset = btn.dataset.preset;
      state.filters.count = PRESETS[state.activePreset].count;
      saveFilters();
      renderSetup();
    });
  });

  document.querySelectorAll('.pill[data-group]').forEach(btn => {
    btn.addEventListener('click', () => {
      const group = btn.dataset.group;
      const value = btn.dataset.value;
      const key = group === 'club' ? 'clubIds' : group === 'category' ? 'categoryIds' : 'decades';
      const list = state.filters[key];
      const typedValue = group === 'decade' ? parseInt(value, 10) : value;
      const idx = list.indexOf(typedValue);
      if (idx >= 0) list.splice(idx, 1); else list.push(typedValue);
      saveFilters();
      renderSetup();
    });
  });

  document.getElementById('f-count').addEventListener('input', e => {
    state.filters.count = parseInt(e.target.value, 10) || 1;
    state.activePreset = null;
    saveFilters();
  });
  document.getElementById('f-avoid-repeats').addEventListener('change', e => {
    state.filters.avoidRepeats = e.target.checked; saveFilters();
  });
  document.getElementById('f-generate-mc').addEventListener('change', e => {
    state.filters.generateMc = e.target.checked; saveFilters();
  });
  document.getElementById('generate-btn').addEventListener('click', generateQuiz);

  if (state.authModalOpen) renderAuthModal();
  if (state.settingsOpen) renderSettingsModal();
}

function pillHtml(group, value, label, active) {
  return `<button type="button" class="pill ${active ? 'active' : ''}" data-group="${group}" data-value="${escapeAttr(value)}">${escapeHtml(label)}</button>`;
}

function renderPlaying() {
  const item = state.quiz[state.currentIndex];
  const isLast = state.currentIndex === state.quiz.length - 1;
  const answered = state.answered !== null;
  const isMc = item.options && item.options.length > 0;

  let bodyHtml;
  if (isMc) {
    const optionsHtml = item.options.map(opt => {
      let cls = 'opt';
      if (answered) {
        cls += ' disabled';
        if (opt.option_text === state.answered) cls += opt.is_correct ? ' correct' : ' incorrect';
        else if (opt.is_correct) cls += ' reveal-correct-not-picked';
      }
      return `<button type="button" class="${cls}" data-opt="${escapeAttr(opt.option_text)}" ${answered ? 'disabled' : ''}>${escapeHtml(opt.option_text)}</button>`;
    }).join('');
    bodyHtml = `<div class="options">${optionsHtml}</div>`;
  } else {
    if (!answered) {
      bodyHtml = `<div class="options"><button type="button" class="opt" id="reveal-btn">Reveal answer</button></div>`;
    } else {
      bodyHtml = `
        <div class="card" style="background:var(--panel-2); margin-bottom:14px;">
          <span class="muted">Answer:</span> <strong>${escapeHtml(item.question.correct_answer || '(no answer on record)')}</strong>
        </div>
        <div class="options">
          <button type="button" class="opt" data-self="correct">I got it right</button>
          <button type="button" class="opt" data-self="incorrect">I got it wrong</button>
        </div>
      `;
    }
  }

  const alreadyReported = state.reportSentFor.has(item.question.id);
  let reportHtml;
  if (alreadyReported) {
    reportHtml = `<p class="muted" style="margin-top:14px;">Thanks — flagged for review.</p>`;
  } else if (state.reportOpenFor === item.question.id) {
    reportHtml = `
      <div class="report-zone">
        <textarea id="report-text" placeholder="What's wrong with this question or answer? (optional)">${escapeHtml(state.reportText)}</textarea>
        <div class="actions-row" style="margin-top:8px;">
          <button class="secondary" id="report-cancel">Cancel</button>
          <button class="primary compact" id="report-submit">Submit report</button>
        </div>
      </div>
    `;
  } else {
    reportHtml = `<div class="report-zone"><button class="text-link" id="report-open">&#9873; Report a problem with this question</button></div>`;
  }

  root.innerHTML = `
    <header class="top">${headerHtml()}</header>
    <div class="card">
      <div class="q-progress">
        <span>Question ${state.currentIndex + 1} of ${state.quiz.length}</span>
        <span>Score: ${state.score}</span>
      </div>
      <div class="q-text">${escapeHtml(item.question.question_text)}</div>
      ${bodyHtml}
      <div class="actions-row">
        ${answered ? `<button class="primary compact" id="next-btn">${isLast ? 'See results' : 'Next question'}</button>` : ''}
      </div>
      ${reportHtml}
    </div>
  `;

  wireHeaderEvents();

  if (isMc) {
    if (!answered) {
      document.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => selectOption(btn.dataset.opt)));
    } else {
      document.getElementById('next-btn').addEventListener('click', nextQuestion);
    }
  } else {
    if (!answered) {
      document.getElementById('reveal-btn').addEventListener('click', () => { state.answered = 'revealed'; render(); });
    } else {
      document.querySelectorAll('[data-self]').forEach(btn => btn.addEventListener('click', () => selectSelfAssessed(btn.dataset.self === 'correct')));
      document.getElementById('next-btn').addEventListener('click', nextQuestion);
    }
  }

  const reportOpenBtn = document.getElementById('report-open');
  if (reportOpenBtn) reportOpenBtn.addEventListener('click', () => { state.reportOpenFor = item.question.id; state.reportText = ''; render(); });
  const reportCancelBtn = document.getElementById('report-cancel');
  if (reportCancelBtn) reportCancelBtn.addEventListener('click', () => { state.reportOpenFor = null; render(); });
  const reportSubmitBtn = document.getElementById('report-submit');
  if (reportSubmitBtn) reportSubmitBtn.addEventListener('click', () => submitReport(item.question.id));
  const reportTextEl = document.getElementById('report-text');
  if (reportTextEl) reportTextEl.addEventListener('input', e => { state.reportText = e.target.value; });

  if (state.settingsOpen) renderSettingsModal();
  if (state.authModalOpen) renderAuthModal();
}

async function submitReport(questionId) {
  try {
    await supabase.from('question_reports').insert({
      question_id: questionId,
      reported_by: state.user ? state.user.id : null,
      reason: state.reportText || null,
    });
  } catch (err) { console.error('report failed', err); }
  state.reportSentFor.add(questionId);
  state.reportOpenFor = null;
  render();
}

function renderResults() {
  const pct = state.quiz.length ? Math.round((state.score / state.quiz.length) * 100) : 0;
  root.innerHTML = `
    <header class="top">${headerHtml()}</header>
    <div class="card score-hero">
      <div class="muted">You scored</div>
      <div class="big">${state.score} / ${state.quiz.length}</div>
      <div class="muted">${pct}%</div>
    </div>
    <div class="card" style="display:flex; gap:12px;">
      <button class="secondary" id="again-btn" style="flex:1;">New quiz, same criteria</button>
      <button class="primary" id="setup-btn" style="flex:1;">Change criteria</button>
    </div>
  `;
  wireHeaderEvents();
  document.getElementById('again-btn').addEventListener('click', generateQuiz);
  document.getElementById('setup-btn').addEventListener('click', () => { state.view = 'setup'; render(); });
  if (state.settingsOpen) renderSettingsModal();
  if (state.authModalOpen) renderAuthModal();
}

function selectOption(optionText) {
  state.answered = optionText;
  const item = state.quiz[state.currentIndex];
  const chosen = item.options.find(o => o.option_text === optionText);
  const wasCorrect = !!(chosen && chosen.is_correct);
  if (wasCorrect) state.score += 1;
  logAnswer(item, wasCorrect, optionText);
  render();
}

function selectSelfAssessed(wasCorrect) {
  if (wasCorrect) state.score += 1;
  const item = state.quiz[state.currentIndex];
  logAnswer(item, wasCorrect, wasCorrect ? 'self:correct' : 'self:incorrect');
  document.querySelectorAll('[data-self]').forEach(btn => {
    btn.disabled = true;
    if ((btn.dataset.self === 'correct') === wasCorrect) btn.classList.add(wasCorrect ? 'correct' : 'incorrect');
  });
}

async function logAnswer(item, wasCorrect, answerGiven) {
  if (!state.currentSessionId) return;
  try {
    await supabase.from('quiz_session_questions').insert({
      session_id: state.currentSessionId,
      question_id: item.question.id,
      fact_id: item.question.fact_id,
      answer_given: String(answerGiven).slice(0, 200),
      was_correct: wasCorrect,
    });
  } catch (err) { console.error('history log failed', err); }
}

function nextQuestion() {
  if (state.currentIndex < state.quiz.length - 1) {
    state.currentIndex += 1;
    state.answered = null;
    render();
  } else {
    addServedFactIds(state.quiz.map(q => q.question.fact_id));
    state.view = 'results';
    render();
  }
}

// --- Auth ---------------------------------------------------------------

function renderAuthModal() {
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.id = 'auth-backdrop';
  wrap.innerHTML = `
    <div class="modal">
      <button class="close-x" id="auth-close">&times;</button>
      <h2>${state.authTab === 'login' ? 'Sign in' : 'Create an account'}</h2>
      <div class="tab-row">
        <button class="tab-btn ${state.authTab === 'login' ? 'active' : ''}" id="tab-login">Sign in</button>
        <button class="tab-btn ${state.authTab === 'register' ? 'active' : ''}" id="tab-register">Register</button>
      </div>
      <div class="field">
        <label class="field-label">Email</label>
        <input type="email" id="auth-email" autocomplete="email" />
      </div>
      <div class="field">
        <label class="field-label">Password</label>
        <input type="password" id="auth-password" autocomplete="${state.authTab === 'login' ? 'current-password' : 'new-password'}" />
      </div>
      ${state.authMessage ? `<p class="muted" style="margin-bottom:14px;">${escapeHtml(state.authMessage)}</p>` : ''}
      <button class="primary" id="auth-submit" ${state.authBusy ? 'disabled' : ''}>${state.authBusy ? 'Please wait…' : (state.authTab === 'login' ? 'Sign in' : 'Create account')}</button>
      <p class="muted" style="margin-top:12px;">Accounts let this app remember which questions you've already been quizzed on, across devices.</p>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('auth-close').addEventListener('click', () => { state.authModalOpen = false; state.authMessage = ''; closeModal('auth-backdrop'); });
  document.getElementById('tab-login').addEventListener('click', () => { state.authTab = 'login'; state.authMessage = ''; refreshModal('auth-backdrop', renderAuthModal); });
  document.getElementById('tab-register').addEventListener('click', () => { state.authTab = 'register'; state.authMessage = ''; refreshModal('auth-backdrop', renderAuthModal); });
  document.getElementById('auth-submit').addEventListener('click', submitAuth);
  wrap.addEventListener('click', e => { if (e.target === wrap) { state.authModalOpen = false; closeModal('auth-backdrop'); } });
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}
function refreshModal(id, renderFn) {
  closeModal(id);
  renderFn();
}

async function submitAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!email || !password) { state.authMessage = 'Enter an email and password.'; refreshModal('auth-backdrop', renderAuthModal); return; }
  state.authBusy = true;
  refreshModal('auth-backdrop', renderAuthModal);
  try {
    if (state.authTab === 'login') {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      state.authModalOpen = false;
    } else {
      const { error } = await supabase.auth.signUp({
        email, password,
        options: { emailRedirectTo: window.location.href },
      });
      if (error) throw error;
      state.authMessage = 'Check your email to confirm your account, then sign in.';
      state.authTab = 'login';
    }
  } catch (err) {
    state.authMessage = err.message || 'Something went wrong.';
  } finally {
    state.authBusy = false;
    refreshModal('auth-backdrop', renderAuthModal);
  }
}

async function signOut() {
  await supabase.auth.signOut();
  state.settingsOpen = false;
  closeModal('settings-backdrop');
  render();
}

// --- Data loading ------------------------------------------------------

async function loadFilterOptions() {
  state.view = 'loading';
  render();
  try {
    const [clubsRes, categoriesRes, decadesRes, answerBankRes] = await Promise.all([
      supabase.from('questions').select('club_id, clubs(id, name, primary_color, secondary_color)').eq('status', 'published'),
      supabase.from('questions').select('category_id, categories(id, name)').eq('status', 'published'),
      supabase.from('questions').select('decade').eq('status', 'published'),
      supabase.from('questions').select('category_id, correct_answer').eq('status', 'published'),
    ]);
    if (clubsRes.error) throw clubsRes.error;
    if (categoriesRes.error) throw categoriesRes.error;
    if (decadesRes.error) throw decadesRes.error;
    if (answerBankRes.error) throw answerBankRes.error;

    const clubMap = new Map();
    (clubsRes.data || []).forEach(row => { if (row.clubs) clubMap.set(row.clubs.id, row.clubs); });
    state.clubs = [...clubMap.values()].sort((a, b) => a.name.localeCompare(b.name));

    const catMap = new Map();
    (categoriesRes.data || []).forEach(row => { if (row.categories) catMap.set(row.categories.id, row.categories.name); });
    state.categories = [...catMap.entries()].map(([id, name]) => ({ id, name })).sort((a, b) => a.name.localeCompare(b.name));

    const decadeSet = new Set();
    (decadesRes.data || []).forEach(row => { if (row.decade !== null && row.decade !== undefined) decadeSet.add(row.decade); });
    state.decades = [...decadeSet].sort((a, b) => a - b);

    const bank = {};
    (answerBankRes.data || []).forEach(row => {
      if (!row.correct_answer) return;
      const key = row.category_id || '__none__';
      if (!bank[key]) bank[key] = new Set();
      bank[key].add(row.correct_answer);
    });
    state.answerBank = bank;

    // Clean stale filter selections (e.g. localStorage referencing ids that no longer exist)
    state.filters.clubIds = state.filters.clubIds.filter(id => state.clubs.some(c => c.id === id));
    state.filters.categoryIds = state.filters.categoryIds.filter(id => state.categories.some(c => c.id === id));
    state.filters.decades = state.filters.decades.filter(d => state.decades.includes(d));

    state.view = 'setup';
    render();
  } catch (err) {
    console.error(err);
    state.errorMessage = 'Could not load quiz options from the database: ' + (err.message || err);
    state.view = 'error';
    render();
  }
}

async function getServerServedFactIds() {
  if (!state.user) return new Set();
  try {
    const { data: sessions, error: sErr } = await supabase.from('quiz_sessions').select('id').eq('user_id', state.user.id);
    if (sErr || !sessions || !sessions.length) return new Set();
    const sessionIds = sessions.map(s => s.id);
    const { data: served, error: qErr } = await supabase.from('quiz_session_questions').select('fact_id').in('session_id', sessionIds);
    if (qErr || !served) return new Set();
    return new Set(served.map(r => r.fact_id).filter(Boolean));
  } catch (err) {
    console.error('could not load server history', err);
    return new Set();
  }
}

function buildAutoOptions(question) {
  const key = question.category_id || '__none__';
  const bank = state.answerBank[key] || new Set();
  const candidates = [...bank].filter(a => a !== question.correct_answer);
  shuffle(candidates);
  let distractors = candidates.slice(0, 3);
  if (distractors.length < 3) {
    // fall back to the whole answer bank if this category is too thin
    const allAnswers = new Set();
    Object.values(state.answerBank).forEach(set => set.forEach(a => allAnswers.add(a)));
    const extra = [...allAnswers].filter(a => a !== question.correct_answer && !distractors.includes(a));
    shuffle(extra);
    distractors = distractors.concat(extra.slice(0, 3 - distractors.length));
  }
  const opts = [
    { option_text: question.correct_answer, is_correct: true },
    ...distractors.map(d => ({ option_text: d, is_correct: false })),
  ];
  shuffle(opts);
  return opts;
}

async function generateQuiz() {
  const btn = document.getElementById('generate-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }

  try {
    let query = supabase
      .from('questions')
      .select('id, fact_id, question_text, correct_answer, template_type, club_id, category_id, decade, question_options(id, option_text, is_correct)')
      .eq('status', 'published');

    if (state.filters.clubIds.length) query = query.in('club_id', state.filters.clubIds);
    if (state.filters.categoryIds.length) query = query.in('category_id', state.filters.categoryIds);
    if (state.filters.decades.length) query = query.in('decade', state.filters.decades);

    const { data, error } = await query;
    if (error) throw error;
    let pool = data || [];

    const byFact = new Map();
    pool.forEach(q => {
      if (!byFact.has(q.fact_id)) byFact.set(q.fact_id, []);
      byFact.get(q.fact_id).push(q);
    });
    let factIds = [...byFact.keys()];

    if (state.filters.avoidRepeats) {
      const localServed = getServedFactIds();
      const serverServed = await getServerServedFactIds();
      const served = new Set([...localServed, ...serverServed]);
      const fresh = factIds.filter(id => !served.has(id));
      if (fresh.length >= Math.min(state.filters.count, factIds.length)) factIds = fresh;
    }

    shuffle(factIds);
    const chosenFactIds = factIds.slice(0, state.filters.count);

    if (chosenFactIds.length === 0) {
      window.alert('No questions match those criteria yet. Try widening the filters.');
      if (btn) { btn.disabled = false; btn.textContent = 'Generate Quiz'; }
      return;
    }

    const quiz = chosenFactIds.map(factId => {
      const candidates = byFact.get(factId);
      const question = candidates[Math.floor(Math.random() * candidates.length)];
      let options = [...(question.question_options || [])];
      if (options.length === 0 && state.filters.generateMc && question.correct_answer) {
        options = buildAutoOptions(question);
      } else {
        shuffle(options);
      }
      return { question, options };
    });

    state.quiz = quiz;
    state.currentIndex = 0;
    state.answered = null;
    state.score = 0;
    state.reportSentFor = new Set();

    // Start a session record (works whether signed in or anonymous; anonymous
    // rows just can't be read back later, which is fine — they're best-effort).
    try {
      const { data: sessionRow, error: sessErr } = await supabase
        .from('quiz_sessions')
        .insert({
          user_id: state.user ? state.user.id : null,
          criteria: {
            club_ids: state.filters.clubIds,
            category_ids: state.filters.categoryIds,
            decades: state.filters.decades,
            count: state.filters.count,
          },
        })
        .select('id')
        .single();
      state.currentSessionId = sessErr ? null : sessionRow.id;
    } catch (e) {
      state.currentSessionId = null;
    }

    state.view = 'playing';
    render();
  } catch (err) {
    console.error(err);
    state.errorMessage = 'Could not generate a quiz: ' + (err.message || err);
    state.view = 'error';
    render();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Generate Quiz'; }
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
}
function escapeAttr(str) { return escapeHtml(str).replace(/`/g, '&#96;'); }

// --- Boot ---------------------------------------------------------------

supabase.auth.onAuthStateChange((_event, session) => {
  state.user = session ? session.user : null;
  if (state.view !== 'loading') render();
});

supabase.auth.getSession().then(({ data }) => {
  state.user = data.session ? data.session.user : null;
  loadFilterOptions();
});
</script>
