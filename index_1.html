<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz Composer — Football Trivia</title>
<style>
  :root {
    --club-primary: #1e3a8a;
    --club-secondary: #ffffff;
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --text: #f2f3f5;
    --muted: #9aa1ac;
    --good: #2e7d5b;
    --bad: #b3475a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header.top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .crest-dot {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--club-primary), var(--club-secondary));
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.15);
  }
  header.top h1 {
    font-size: 1.35rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.top p {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .card {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 18px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  select, input[type="number"] {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.95rem;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .preset-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .preset-btn {
    background: var(--panel-2);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .preset-btn.active {
    background: var(--club-primary);
    border-color: var(--club-primary);
  }
  button.primary {
    width: 100%;
    background: var(--club-primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .q-progress {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .q-text {
    font-size: 1.15rem;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    text-align: left;
    background: var(--panel-2);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    padding: 13px 16px;
    border-radius: 10px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .opt:hover { border-color: rgba(255,255,255,0.3); }
  .opt.correct { background: var(--good); border-color: var(--good); }
  .opt.incorrect { background: var(--bad); border-color: var(--bad); }
  .opt.disabled { cursor: default; opacity: 0.85; }
  .opt.reveal-correct-not-picked {
    border-color: var(--good);
    box-shadow: inset 0 0 0 2px var(--good);
  }
  .actions-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 18px;
  }
  .score-hero {
    text-align: center;
    padding: 30px 10px 10px;
  }
  .score-hero .big {
    font-size: 2.6rem;
    font-weight: 700;
  }
  .footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 30px;
    line-height: 1.6;
  }
  .footer-note a { color: var(--muted); }
  .error-box {
    background: rgba(179,71,90,0.15);
    border: 1px solid var(--bad);
    border-radius: 10px;
    padding: 14px;
    font-size: 0.9rem;
  }
  .spinner-row { text-align: center; padding: 30px 0; color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// --- Configuration -----------------------------------------------------
// These are the project's PUBLIC anon key + URL. The anon key is safe to
// ship in client-side code: Row Level Security policies on the database
// only expose reference tables and questions/options with status =
// 'published'. See README.md for details.
const SUPABASE_URL = 'https://nljdrrwpdbljovvvuebj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5samRycndwZGJsam92dnZ1ZWJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MDE4NDIsImV4cCI6MjEwMjk3Nzg0Mn0.gWXrI7RTNQ3j50s7P-Saavcjn0sLtEZdQjN4eDJ-v3M';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// --- Audience presets ----------------------------------------------------
// Saved criteria bundles per the platform spec (§5). Difficulty-tier mixes
// are best-effort: most current facts aren't tier-tagged yet, so a preset
// mainly controls question count until tiering is populated.
const PRESETS = {
  pub_quiz:  { label: 'Pub Quiz Night', count: 20 },
  casual:    { label: 'Casual',         count: 10 },
  stato:     { label: 'Hardcore Stato', count: 30 },
  quickfire: { label: 'Quick Fire (5)', count: 5 },
};

const LS_KEY = 'quizComposer.servedFactIds.v1';

function getServedFactIds() {
  try {
    return new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]'));
  } catch (e) {
    return new Set();
  }
}
function addServedFactIds(ids) {
  try {
    const cur = getServedFactIds();
    ids.forEach(id => cur.add(id));
    localStorage.setItem(LS_KEY, JSON.stringify([...cur]));
  } catch (e) { /* ignore - non-essential */ }
}

// --- App state -------------------------------------------------------
const state = {
  view: 'loading', // loading | setup | error | playing | results
  errorMessage: '',
  clubs: [],
  categories: [],
  decades: [],
  activePreset: null,
  criteria: {
    club_id: '',
    category_id: '',
    decade: '',
    count: 10,
    avoidRepeats: true,
  },
  quiz: [],       // array of {question, options[]}
  currentIndex: 0,
  answered: null, // option_text chosen for current question, or null
  score: 0,
};

const root = document.getElementById('app');

function render() {
  if (state.view === 'loading') return renderLoading();
  if (state.view === 'error') return renderError();
  if (state.view === 'setup') return renderSetup();
  if (state.view === 'playing') return renderPlaying();
  if (state.view === 'results') return renderResults();
}

function renderLoading() {
  root.innerHTML = `
    <header class="top">${headerHtml()}</header>
    <div class="card spinner-row">Loading quiz options…</div>
  `;
}

function renderError() {
  root.innerHTML = `
    <header class="top">${headerHtml()}</header>
    <div class="card">
      <div class="error-box">${escapeHtml(state.errorMessage)}</div>
    </div>
  `;
}

function headerHtml() {
  return `
    <div class="crest-dot"></div>
    <div>
      <h1>Quiz Composer</h1>
      <p>Multi-club football trivia, generated from a sourced fact database</p>
    </div>
  `;
}

function renderSetup() {
  const clubOptions = state.clubs.map(c =>
    `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  const categoryOptions = state.categories.map(c =>
    `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  const decadeOptions = state.decades.map(d =>
    `<option value="${d}">${d}s</option>`).join('');

  const presetButtons = Object.entries(PRESETS).map(([key, p]) => `
    <button type="button" class="preset-btn ${state.activePreset === key ? 'active' : ''}" data-preset="${key}">
      ${escapeHtml(p.label)}
    </button>
  `).join('');

  root.innerHTML = `
    <header class="top">${headerHtml()}</header>

    <div class="card">
      <div class="field">
        <label>Audience preset</label>
        <div class="preset-row">${presetButtons}</div>
        <p class="muted">Presets just set a question count for now — pick one or configure manually below.</p>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Club</label>
          <select id="f-club">
            <option value="">Any club</option>
            ${clubOptions}
          </select>
        </div>
        <div class="field">
          <label>Category</label>
          <select id="f-category">
            <option value="">Any category</option>
            ${categoryOptions}
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Era (decade)</label>
          <select id="f-decade">
            <option value="">Any era</option>
            ${decadeOptions}
          </select>
        </div>
        <div class="field">
          <label>Number of questions</label>
          <input type="number" id="f-count" min="1" max="50" value="${state.criteria.count}" />
        </div>
      </div>

      <div class="field">
        <label style="display:flex; align-items:center; gap:8px; text-transform:none; letter-spacing:normal;">
          <input type="checkbox" id="f-avoid-repeats" ${state.criteria.avoidRepeats ? 'checked' : ''} style="width:auto;" />
          Avoid facts I've already been quizzed on (this browser)
        </label>
      </div>

      <button class="primary" id="generate-btn">Generate Quiz</button>
      <p class="muted" id="match-count" style="margin-top:10px;"></p>
    </div>

    <p class="footer-note">
      Every question here traces back to a sourced, categorized fact —
      see the <a href="https://github.com" target="_blank" rel="noopener">project README</a>
      for how the fact and question database is built and verified.
    </p>
  `;

  document.getElementById('f-club').value = state.criteria.club_id;
  document.getElementById('f-category').value = state.criteria.category_id;
  document.getElementById('f-decade').value = state.criteria.decade;

  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.preset;
      state.activePreset = key;
      state.criteria.count = PRESETS[key].count;
      renderSetup();
    });
  });

  document.getElementById('f-club').addEventListener('change', e => {
    state.criteria.club_id = e.target.value;
  });
  document.getElementById('f-category').addEventListener('change', e => {
    state.criteria.category_id = e.target.value;
  });
  document.getElementById('f-decade').addEventListener('change', e => {
    state.criteria.decade = e.target.value;
  });
  document.getElementById('f-count').addEventListener('input', e => {
    state.criteria.count = parseInt(e.target.value, 10) || 1;
    state.activePreset = null;
  });
  document.getElementById('f-avoid-repeats').addEventListener('change', e => {
    state.criteria.avoidRepeats = e.target.checked;
  });

  document.getElementById('generate-btn').addEventListener('click', generateQuiz);
}

function renderPlaying() {
  const item = state.quiz[state.currentIndex];
  const isLast = state.currentIndex === state.quiz.length - 1;
  const answered = state.answered !== null;
  const isMultipleChoice = item.question.template_type === 'multiple_choice' && item.options.length > 0;

  let bodyHtml;
  if (isMultipleChoice) {
    const optionsHtml = item.options.map(opt => {
      let cls = 'opt';
      if (answered) {
        cls += ' disabled';
        if (opt.option_text === state.answered) {
          cls += opt.is_correct ? ' correct' : ' incorrect';
        } else if (opt.is_correct) {
          cls += ' reveal-correct-not-picked';
        }
      }
      return `<button type="button" class="${cls}" data-opt="${escapeAttr(opt.option_text)}" ${answered ? 'disabled' : ''}>
        ${escapeHtml(opt.option_text)}
      </button>`;
    }).join('');
    bodyHtml = `<div class="options">${optionsHtml}</div>`;
  } else {
    // Direct-recall style: no options in the database for this question,
    // so the player self-assesses against the recorded correct answer.
    if (!answered) {
      bodyHtml = `
        <div class="options">
          <button type="button" class="opt" id="reveal-btn">Reveal answer</button>
        </div>
      `;
    } else {
      bodyHtml = `
        <div class="card" style="background:var(--panel-2); margin-bottom:14px;">
          <span class="muted">Answer:</span> <strong>${escapeHtml(item.question.correct_answer || '(no answer on record)')}</strong>
        </div>
        <div class="options">
          <button type="button" class="opt" data-self="correct">I got it right</button>
          <button type="button" class="opt" data-self="incorrect">I got it wrong</button>
        </div>
      `;
    }
  }

  root.innerHTML = `
    <header class="top">${headerHtml()}</header>
    <div class="card">
      <div class="q-progress">
        <span>Question ${state.currentIndex + 1} of ${state.quiz.length}</span>
        <span>Score: ${state.score}</span>
      </div>
      <div class="q-text">${escapeHtml(item.question.question_text)}</div>
      ${bodyHtml}
      <div class="actions-row">
        ${answered
          ? `<button class="primary" id="next-btn" style="width:auto;">${isLast ? 'See results' : 'Next question'}</button>`
          : ''}
      </div>
    </div>
  `;

  if (isMultipleChoice) {
    if (!answered) {
      document.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => selectOption(btn.dataset.opt));
      });
    } else {
      document.getElementById('next-btn').addEventListener('click', nextQuestion);
    }
  } else {
    if (!answered) {
      document.getElementById('reveal-btn').addEventListener('click', () => {
        state.answered = 'revealed';
        render();
      });
    } else {
      document.querySelectorAll('[data-self]').forEach(btn => {
        btn.addEventListener('click', () => selectSelfAssessed(btn.dataset.self === 'correct'));
      });
      document.getElementById('next-btn').addEventListener('click', nextQuestion);
    }
  }
}

function selectSelfAssessed(wasCorrect) {
  if (wasCorrect) state.score += 1;
  // Lock in the self-assessment visually by disabling further clicks.
  document.querySelectorAll('[data-self]').forEach(btn => {
    btn.disabled = true;
    if ((btn.dataset.self === 'correct') === wasCorrect) btn.classList.add(wasCorrect ? 'correct' : 'incorrect');
  });
}

function renderResults() {
  const pct = state.quiz.length ? Math.round((state.score / state.quiz.length) * 100) : 0;
  root.innerHTML = `
    <header class="top">${headerHtml()}</header>
    <div class="card score-hero">
      <div class="muted">You scored</div>
      <div class="big">${state.score} / ${state.quiz.length}</div>
      <div class="muted">${pct}%</div>
    </div>
    <div class="card" style="display:flex; gap:12px;">
      <button class="secondary" id="again-btn" style="flex:1;">New quiz, same criteria</button>
      <button class="primary" id="setup-btn" style="flex:1;">Change criteria</button>
    </div>
  `;
  document.getElementById('again-btn').addEventListener('click', generateQuiz);
  document.getElementById('setup-btn').addEventListener('click', () => {
    state.view = 'setup';
    render();
  });
}

function selectOption(optionText) {
  state.answered = optionText;
  const item = state.quiz[state.currentIndex];
  const chosen = item.options.find(o => o.option_text === optionText);
  if (chosen && chosen.is_correct) state.score += 1;
  render();
}

function nextQuestion() {
  if (state.currentIndex < state.quiz.length - 1) {
    state.currentIndex += 1;
    state.answered = null;
    render();
  } else {
    addServedFactIds(state.quiz.map(q => q.question.fact_id));
    state.view = 'results';
    render();
  }
}

// --- Data loading ------------------------------------------------------

async function loadFilterOptions() {
  state.view = 'loading';
  render();

  try {
    const [clubsRes, categoriesRes, decadesRes] = await Promise.all([
      supabase.from('questions').select('club_id, clubs(id, name)').eq('status', 'published'),
      supabase.from('questions').select('category_id, categories(id, name)').eq('status', 'published'),
      supabase.from('questions').select('decade').eq('status', 'published'),
    ]);

    if (clubsRes.error) throw clubsRes.error;
    if (categoriesRes.error) throw categoriesRes.error;
    if (decadesRes.error) throw decadesRes.error;

    const clubMap = new Map();
    (clubsRes.data || []).forEach(row => {
      if (row.clubs) clubMap.set(row.clubs.id, row.clubs.name);
    });
    state.clubs = [...clubMap.entries()]
      .map(([id, name]) => ({ id, name }))
      .sort((a, b) => a.name.localeCompare(b.name));

    const catMap = new Map();
    (categoriesRes.data || []).forEach(row => {
      if (row.categories) catMap.set(row.categories.id, row.categories.name);
    });
    state.categories = [...catMap.entries()]
      .map(([id, name]) => ({ id, name }))
      .sort((a, b) => a.name.localeCompare(b.name));

    const decadeSet = new Set();
    (decadesRes.data || []).forEach(row => {
      if (row.decade !== null && row.decade !== undefined) decadeSet.add(row.decade);
    });
    state.decades = [...decadeSet].sort((a, b) => a - b);

    state.view = 'setup';
    render();
  } catch (err) {
    console.error(err);
    state.errorMessage = 'Could not load quiz options from the database: ' + (err.message || err);
    state.view = 'error';
    render();
  }
}

async function generateQuiz() {
  const btn = document.getElementById('generate-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }

  try {
    let query = supabase
      .from('questions')
      .select('id, fact_id, question_text, correct_answer, template_type, club_id, category_id, decade, question_options(id, option_text, is_correct)')
      .eq('status', 'published');

    if (state.criteria.club_id) query = query.eq('club_id', state.criteria.club_id);
    if (state.criteria.category_id) query = query.eq('category_id', state.criteria.category_id);
    if (state.criteria.decade) query = query.eq('decade', parseInt(state.criteria.decade, 10));

    const { data, error } = await query;
    if (error) throw error;

    let pool = data || [];

    // Never serve two questions from the same underlying fact in one quiz.
    const byFact = new Map();
    pool.forEach(q => {
      if (!byFact.has(q.fact_id)) byFact.set(q.fact_id, []);
      byFact.get(q.fact_id).push(q);
    });

    let factIds = [...byFact.keys()];

    if (state.criteria.avoidRepeats) {
      const served = getServedFactIds();
      const fresh = factIds.filter(id => !served.has(id));
      // Only apply the "avoid repeats" filter if it leaves enough to work with;
      // otherwise fall back to the full pool rather than serving an empty quiz.
      if (fresh.length >= Math.min(state.criteria.count, factIds.length)) {
        factIds = fresh;
      }
    }

    shuffle(factIds);
    const chosenFactIds = factIds.slice(0, state.criteria.count);

    if (chosenFactIds.length === 0) {
      window.alert('No questions match those criteria yet. Try widening the filters.');
      if (btn) { btn.disabled = false; btn.textContent = 'Generate Quiz'; }
      return;
    }

    const quiz = chosenFactIds.map(factId => {
      const candidates = byFact.get(factId);
      const question = candidates[Math.floor(Math.random() * candidates.length)];
      const options = [...question.question_options];
      shuffle(options);
      return { question, options };
    });

    state.quiz = quiz;
    state.currentIndex = 0;
    state.answered = null;
    state.score = 0;
    state.view = 'playing';
    render();
  } catch (err) {
    console.error(err);
    state.errorMessage = 'Could not generate a quiz: ' + (err.message || err);
    state.view = 'error';
    render();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Generate Quiz'; }
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[s]));
}
function escapeAttr(str) {
  return escapeHtml(str).replace(/`/g, '&#96;');
}

// --- Boot ---------------------------------------------------------------
loadFilterOptions();
</script>
</body>
</html>
